<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HMIS staff login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.12), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(157, 211, 255, 0.2), transparent 26%),
        linear-gradient(135deg, #eaf4ff 0%, #dfefff 20%, #edf7ff 50%, #ecfdf5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    .login-card {
      max-width: 440px;
      width: 100%;
      margin: 40px auto;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 22px 50px rgba(15, 23, 42, 0.12);
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(8px);
    }

    .login-header {
      background: linear-gradient(135deg, #0d5ec9 0%, #0a3e92 100%);
      color: white;
      padding: 2rem 2rem 1.25rem;
      text-align: center;
    }

    .brand-badge {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: rgba(255,255,255,0.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.8rem;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .login-body {
      padding: 2rem;
    }

    .login-title {
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .form-label {
      font-weight: 600;
      color: #334155;
    }

    .btn-login {
      background: linear-gradient(135deg, #0d6efd, #0a5bd6);
      border: none;
      border-radius: 12px;
      padding: 0.8rem 1rem;
      font-weight: 700;
      box-shadow: 0 12px 22px rgba(13,110,253,0.18);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-card card">
      <div class="login-header">
        <div class="brand-badge">+</div>
        <h3 class="mb-1 login-title">HMIS</h3>
        <div class="small text-white-50">St Gabriel Hospital</div>
      </div>
      <div class="login-body">
        <h5 class="text-center mb-4 text-muted">Staff Login</h5>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-login w-100 text-white">Login</button>
        </form>

        <div class="text-center mt-3 text-muted small">
       
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
