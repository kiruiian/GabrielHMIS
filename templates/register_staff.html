{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-4">Register Staff</h4>
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select name="role" class="form-select" required>
              <option value="receptionist">Receptionist</option>
              <option value="doctor">Doctor</option>
              <option value="nurse">Nurse</option>
              <option value="triage">Triage Officer</option>
              <option value="pharmacist">Pharmacist</option>
              <option value="radiographer">Radiographer</option>
              <option value="lab">Laboratory</option>
              <option value="admin">Admin</option>
              <option value="records">Records Officer</option>
              <option value="accounts">Accounts Officer</option>
              <option value="hr">Human Resources</option>
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" minlength="12" required>
            <div class="form-text">Use at least 12 characters.</div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Register Staff</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
